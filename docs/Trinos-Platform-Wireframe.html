<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinos — Status Report Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#1B3A52; --blue-800:#234C6B; --blue-700:#2E5878; --blue-600:#356A92;
  --blue-500:#3D7AA8; --blue-400:#5B8BB5; --blue-300:#8DB1CE; --blue-200:#C0D5E6;
  --blue-100:#DCE8F1; --blue-50:#EEF4F9;
  --silver-700:#6B727B; --silver-600:#8A9099; --silver-500:#9CA2AB; --silver-400:#AEB4BC;
  --silver-300:#C5CAD1; --silver-200:#D9DDE2; --silver-100:#E8EBEE; --silver-50:#F4F6F8;
  --ink:#172430; --ink-2:#3A4756; --ink-3:#6A7686; --ink-4:#97A1AD;
  --paper:#FFFFFF; --paper-2:#F5F7FA; --paper-3:#EEF1F5;
  --line:#E4E9EE; --line-2:#D6DDE4;
  --ok:#2E8B6F; --ok-bg:#E4F2EC; --warn:#C8852A; --warn-bg:#FBF0DF; --danger:#C0473F; --danger-bg:#FBE9E7;
  --purple:#7B4A9E; --purple-bg:#EFE7F5;
  --shadow-sm:0 1px 2px rgba(23,36,48,.06),0 1px 3px rgba(23,36,48,.04);
  --shadow-md:0 4px 14px rgba(23,36,48,.08),0 2px 6px rgba(23,36,48,.05);
  --shadow-lg:0 18px 50px rgba(23,36,48,.16);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --grad-tri:linear-gradient(135deg,#5B8BB5 0%,#3D7AA8 55%,#2E5878 100%);
  --grad-deep:linear-gradient(135deg,#1B3A52 0%,#2E5878 55%,#3D7AA8 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--paper-2);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}
a{color:inherit}
::selection{background:var(--blue-200);color:var(--blue-900)}
svg{display:block}
.hidden{display:none!important}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--silver-300);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--silver-400);background-clip:padding-box}

/* ---------- brand mark ---------- */
.tri-wrap{display:flex;align-items:center;gap:11px}
.tri-word{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:.16em;font-size:18px;color:var(--ink)}
.tri-word .o{color:var(--blue-500)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-md);font-size:14.5px;font-weight:600;transition:.16s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue-500);color:#fff;box-shadow:0 4px 12px rgba(61,122,168,.28)}
.btn-primary:hover{background:var(--blue-600);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-block{width:100%}
.btn-ghost{background:var(--paper);color:var(--ink-2);border:1.5px solid var(--line-2)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--silver-400)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-danger:hover{background:#f6ddda}
.btn-sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:var(--r-sm)}
.btn-sm svg{width:15px;height:15px}
.btn-tiny{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn-tiny svg{width:14px;height:14px}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;background:var(--paper);z-index:50}
.login-left{flex:1.05;background:var(--grad-deep);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:54px 56px;color:#fff}
.login-left::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:46px 46px;opacity:.5}
.login-tri-bg{position:absolute;right:-130px;bottom:-150px;width:560px;opacity:.14;transform:rotate(8deg)}
.login-tri-bg2{position:absolute;left:-90px;top:50px;width:230px;opacity:.10;transform:rotate(-18deg)}
.login-brand{display:flex;align-items:center;gap:13px;position:relative;z-index:2}
.login-brand .tri-word{color:#fff;font-size:20px}
.login-brand .tri-word .o{color:#CFE0EE}
.login-hero{position:relative;z-index:2;max-width:460px}
.login-hero .eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9DC0DC;margin-bottom:18px}
.login-hero h1{font-size:42px;line-height:1.1;font-weight:700;margin-bottom:18px}
.login-hero p{font-size:16.5px;color:#DCEAF4;line-height:1.6;font-weight:400}
.login-points{display:flex;flex-direction:column;gap:13px;margin-top:34px}
.login-point{display:flex;align-items:center;gap:13px;font-size:15px;color:#EAF2F8}
.lp-dot{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0;color:#CFE0EE}
.lp-dot svg{width:16px;height:16px}
.login-foot{position:relative;z-index:2;font-size:12.5px;color:#9DC0DC;letter-spacing:.02em}
.login-right{flex:.95;display:flex;align-items:center;justify-content:center;padding:40px;overflow-y:auto}
.login-card{width:100%;max-width:392px}
.login-card .eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-500);margin-bottom:9px}
.login-card h2{font-size:27px;font-weight:600;margin-bottom:7px}
.login-card .sub{color:var(--ink-3);font-size:14.5px;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input{width:100%;height:46px;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:0 14px;font-size:15px;color:var(--ink);background:var(--paper);transition:.15s}
.input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.input::placeholder{color:var(--ink-4)}
.field-row{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--blue-500);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}
.login-note{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.6}
.role-pick{margin-top:22px}
.role-pick .rp-lbl{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:11px;text-align:center}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rp-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:var(--r-md);background:var(--paper);transition:.14s;text-align:left}
.rp-btn:hover{border-color:var(--blue-400);background:var(--blue-50)}
.rp-btn .rp-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.rp-btn .rp-ico svg{width:16px;height:16px}
.rp-btn .rp-nm{font-size:13.5px;font-weight:600;color:var(--ink)}
.rp-btn .rp-rl{font-size:11.5px;color:var(--ink-4)}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
#app.on{display:block}
.sidebar{width:250px;background:var(--blue-900);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30}
.sb-brand{padding:21px 20px 17px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .tri-word{color:#fff;font-size:17px}
.sb-brand .tri-word .o{color:var(--blue-300)}
.sb-role{margin:16px 14px 6px;padding:13px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-md);display:flex;align-items:center;gap:11px}
.sb-role .avatar{width:38px;height:38px;font-size:14px}
.sb-role .sr-nm{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-role .sr-rl{font-size:12px;color:var(--blue-300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 18px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5E7E9A;padding:16px 12px 7px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);color:#BCD0E0;font-size:14px;font-weight:500;transition:.13s;width:100%;text-align:left;position:relative}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--blue-500);color:#fff;box-shadow:0 4px 12px rgba(61,122,168,.4)}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav-item.active .badge{background:rgba(255,255,255,.25)}
.sb-foot{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08)}

.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:66px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20}
.topbar .crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-4);font-weight:500}
.topbar .crumbs .cur{color:var(--ink);font-weight:600}
.topbar .crumbs svg{width:14px;height:14px;opacity:.6}
.searchbar{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);height:40px;padding:0 13px;width:280px;color:var(--ink-4)}
.searchbar svg{width:16px;height:16px}
.searchbar input{border:none;background:none;outline:none;font-size:14px;color:var(--ink);width:100%}
.tb-btn{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3);position:relative;border:1px solid var(--line);background:var(--paper);transition:.13s}
.tb-btn svg{width:18px;height:18px}
.tb-btn:hover{background:var(--paper-2);color:var(--ink)}
.tb-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--paper)}
.tb-avatar{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 4px;border-radius:var(--r-md);transition:.13s}
.tb-avatar:hover{background:var(--paper-2)}
.tb-avatar .avatar{width:38px;height:38px;font-size:14px}
.tb-avatar .tba-nm{font-size:13.5px;font-weight:600;line-height:1.2}
.tb-avatar .tba-rl{font-size:12px;color:var(--ink-4)}

.content{padding:30px 30px 60px;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:18px;flex-wrap:wrap}
.page-head .pe{font-size:12.5px;font-weight:600;color:var(--blue-500);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.page-head h2{font-size:25px;font-weight:600;line-height:1.2}
.page-head p{color:var(--ink-3);font-size:14.5px;margin-top:6px;max-width:560px}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* avatar */
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:var(--blue-500);font-family:'Sora';flex-shrink:0;letter-spacing:.01em}
.avatar.green{background:var(--ok)} .avatar.purple{background:var(--purple)} .avatar.warn{background:var(--warn)}
.avatar.silver{background:var(--silver-600)} .avatar.deep{background:var(--blue-800)}

/* cards & grid */
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:1.55fr 1fr}
.g-1-2{grid-template-columns:1fr 1.65fr}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:15.5px;font-weight:600}
.card-head .sub{font-size:12.5px;color:var(--ink-4);margin-top:2px}
.card-head .ch-r{display:flex;align-items:center;gap:8px}

/* stat */
.stat{padding:20px 22px;position:relative;overflow:hidden}
.stat .ico-box{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;margin-bottom:14px}
.stat .ico-box svg{width:20px;height:20px}
.stat .val{font-family:'Sora';font-size:29px;font-weight:700;line-height:1;letter-spacing:-.02em}
.stat .lbl{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:7px}
.stat .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:11px;padding:3px 8px;border-radius:20px}
.delta svg{width:12px;height:12px}
.delta.up{color:var(--ok);background:var(--ok-bg)}
.delta.down{color:var(--danger);background:var(--danger-bg)}
.delta.flat{color:var(--ink-3);background:var(--paper-3)}
.ic-blue{background:var(--blue-50);color:var(--blue-600)}
.ic-silver{background:var(--silver-100);color:var(--silver-700)}
.ic-ok{background:var(--ok-bg);color:var(--ok)}
.ic-warn{background:var(--warn-bg);color:var(--warn)}
.ic-purple{background:var(--purple-bg);color:var(--purple)}
.ic-danger{background:var(--danger-bg);color:var(--danger)}

/* report list */
.rep-row{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);transition:.12s;cursor:pointer}
.rep-row:last-child{border-bottom:none}
.rep-row:hover{background:var(--paper-2)}
.rep-date{width:52px;text-align:center;flex-shrink:0}
.rep-date .d{font-family:'Sora';font-size:20px;font-weight:700;line-height:1}
.rep-date .m{font-size:10.5px;text-transform:uppercase;color:var(--ink-4);font-weight:700;letter-spacing:.04em;margin-top:3px}
.rep-body{flex:1;min-width:0}
.rep-body .t{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rep-body .x{font-size:13px;color:var(--ink-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rep-chev{color:var(--ink-4);flex-shrink:0;transition:.2s}
.rep-chev svg{width:18px;height:18px}
.rep-row.open .rep-chev{transform:rotate(90deg)}
.rep-detail{padding:0 22px 20px 88px;border-bottom:1px solid var(--line);background:var(--paper-2);animation:fade .3s}
.rd-field{padding:14px 0;border-bottom:1px dashed var(--line-2)}
.rd-field:last-child{border-bottom:none}
.rd-field .lbl{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue-500);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.rd-field .lbl .ff-num{width:20px;height:20px;border-radius:6px;background:var(--blue-50);color:var(--blue-600);font-size:11px;display:grid;place-items:center;font-family:'Sora';font-weight:700}
.rd-field .val{font-size:14px;color:var(--ink-2);line-height:1.6}
.rd-field.blk .lbl{color:var(--danger)} .rd-field.blk .lbl .ff-num{background:var(--danger-bg);color:var(--danger)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.tag svg{width:11px;height:11px}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-blue{background:var(--blue-50);color:var(--blue-600)}
.tag-gray{background:var(--paper-3);color:var(--ink-3)}
.tag-purple{background:var(--purple-bg);color:var(--purple)}

/* submission form */
.form-card{max-width:780px}
.form-field{padding:20px 24px;border-bottom:1px solid var(--line)}
.form-field:last-child{border-bottom:none}
.ff-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ff-num{width:24px;height:24px;border-radius:7px;background:var(--blue-50);color:var(--blue-600);font-size:12px;font-weight:700;display:grid;place-items:center;font-family:'Sora'}
.ff-head .ttl{font-size:15px;font-weight:600}
.ff-head .req{font-size:10.5px;font-weight:700;color:var(--danger);background:var(--danger-bg);padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.ff-head .opt{font-size:10.5px;font-weight:600;color:var(--ink-4);background:var(--paper-3);padding:2px 7px;border-radius:5px}
.ff-hint{font-size:13px;color:var(--ink-4);margin:2px 0 11px 34px}
.toolbar{display:flex;gap:2px;margin:0 0 8px 34px;padding:5px;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;width:fit-content}
.tb-fmt{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);font-size:13px;font-weight:700}
.tb-fmt svg{width:15px;height:15px}
.tb-fmt:hover{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
.textarea{width:calc(100% - 34px);margin-left:34px;min-height:88px;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;color:var(--ink);resize:vertical;line-height:1.6}
.textarea:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.textarea.err{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-bg)}
.ff-foot{margin-left:34px;margin-top:7px;font-size:12px;color:var(--ink-4);display:flex;justify-content:space-between;align-items:center}
.ff-foot .err-msg{color:var(--danger);font-weight:600;display:none}
.ff-foot .err-msg.show{display:inline}
.form-foot{padding:18px 24px;display:flex;align-items:center;gap:12px;background:var(--paper-2);border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
.form-foot .save-note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);margin-right:auto}
.save-note svg{width:15px;height:15px;color:var(--ok)}

/* bars */
.bar-track{height:8px;background:var(--paper-3);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:var(--grad-tri)}
.bar-fill.ok{background:var(--ok)} .bar-fill.warn{background:var(--warn)} .bar-fill.danger{background:var(--danger)}

/* team status grid */
.member-row{display:grid;grid-template-columns:1.7fr repeat(5,46px) 1fr;align-items:center;padding:13px 22px;border-bottom:1px solid var(--line);gap:8px}
.member-row.head{background:var(--paper-2);font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.member-row:last-child{border-bottom:none}
.member-cell{display:flex;align-items:center;gap:11px;min-width:0}
.member-cell .avatar{width:36px;height:36px;font-size:13px}
.member-cell .nm{font-size:14px;font-weight:600}
.member-cell .em{font-size:12px;color:var(--ink-4)}
.daycell{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;margin:0 auto}
.daycell svg{width:14px;height:14px}
.dc-ok{background:var(--ok-bg);color:var(--ok)}
.dc-miss{background:var(--paper-3);color:var(--ink-4)}
.dc-late{background:var(--warn-bg);color:var(--warn)}

/* blocker */
.blocker{display:flex;gap:13px;padding:15px 18px;border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:var(--r-md);background:var(--paper);margin-bottom:12px}
.blocker.med{border-left-color:var(--warn)}
.blocker .bk-ico{width:34px;height:34px;border-radius:9px;background:var(--danger-bg);color:var(--danger);display:grid;place-items:center;flex-shrink:0}
.blocker .bk-ico svg{width:17px;height:17px}
.blocker.med .bk-ico{background:var(--warn-bg);color:var(--warn)}
.blocker .bk-body{flex:1;min-width:0}
.blocker .bk-t{font-size:14px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.blocker .bk-x{font-size:13px;color:var(--ink-3);line-height:1.5}
.blocker .bk-meta{font-size:12px;color:var(--ink-4);margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blocker .bk-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}

/* compliance bars */
.team-bar{display:grid;grid-template-columns:160px 1fr 54px;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.team-bar:last-child{border-bottom:none}
.team-bar .tn{font-size:14px;font-weight:600}
.team-bar .tn small{display:block;font-size:12px;color:var(--ink-4);font-weight:400}
.team-bar .pct{font-family:'Sora';font-weight:700;font-size:15px;text-align:right}

/* admin table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--paper-2)}
.tbl .u-cell{display:flex;align-items:center;gap:11px}
.tbl .u-cell .avatar{width:36px;height:36px;font-size:13px}
.tbl .u-cell .nm{font-weight:600;font-size:14px}
.tbl .u-cell .em{font-size:12px;color:var(--ink-4)}
.tbl-acts{display:flex;gap:4px;justify-content:flex-end}
.tbl-act{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-4)}
.tbl-act svg{width:16px;height:16px}
.tbl-act:hover{background:var(--paper-3);color:var(--ink)}

/* chat */
.chat-wrap{display:grid;grid-template-columns:288px 1fr;height:calc(100vh - 66px - 90px);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--paper);box-shadow:var(--shadow-sm)}
.chat-list{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper-2)}
.chat-search{padding:13px}
.chat-search .searchbar{width:100%;background:var(--paper)}
.chat-tabs{display:flex;gap:4px;padding:0 13px 11px}
.chat-tab{flex:1;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:7px;border-radius:8px;text-align:center}
.chat-tab.active{background:var(--paper);color:var(--blue-600);box-shadow:var(--shadow-sm)}
.chat-conv{flex:1;overflow-y:auto}
.conv-item{display:flex;gap:11px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line);position:relative;transition:.12s}
.conv-item:hover{background:var(--paper)}
.conv-item.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--blue-500)}
.conv-item .avatar{width:40px;height:40px;font-size:14px}
.conv-item .ci-body{flex:1;min-width:0}
.conv-item .ci-top{display:flex;justify-content:space-between;gap:8px}
.conv-item .ci-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .ci-time{font-size:11px;color:var(--ink-4);flex-shrink:0}
.conv-item .ci-last{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-item .ci-unread{background:var(--blue-500);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;align-self:center}
.chat-panel{display:flex;flex-direction:column;min-width:0}
.chat-top{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
.chat-top .avatar{width:40px;height:40px;font-size:14px}
.chat-top .ct-nm{font-size:15px;font-weight:600}
.chat-top .ct-sub{font-size:12.5px;color:var(--ok);display:flex;align-items:center;gap:6px}
.chat-top .ct-sub::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat-top .ct-acts{margin-left:auto;display:flex;gap:6px}
.chat-body{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:13px;background:var(--paper-2)}
.chat-day{text-align:center;font-size:11.5px;color:var(--ink-4);font-weight:600;margin:4px 0}
.msg{max-width:66%;display:flex;flex-direction:column;gap:4px}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg .bubble{padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.5}
.msg.in .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.out .bubble{background:var(--blue-500);color:#fff;border-bottom-right-radius:5px}
.msg .meta{font-size:11px;color:var(--ink-4);padding:0 4px;display:flex;align-items:center;gap:5px}
.msg .meta svg{width:13px;height:13px;color:var(--blue-400)}
.msg-ref{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:11px;padding:9px 12px;font-size:13px;color:var(--blue-700);display:flex;align-items:center;gap:9px;cursor:pointer}
.msg-ref svg{width:16px;height:16px;flex-shrink:0}
.bot-card{align-self:flex-start;max-width:74%;background:var(--paper);border:1px solid var(--line);border-radius:15px;border-bottom-left-radius:5px;padding:13px 15px}
.bot-card .bc-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--blue-600);margin-bottom:8px}
.bot-card .bc-head svg{width:16px;height:16px}
.bot-card .bc-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.quick{font-size:12.5px;font-weight:600;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--blue-100);padding:6px 12px;border-radius:20px}
.quick:hover{background:var(--blue-100)}
.chat-input{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line)}
.chat-input .ci-attach{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-4)}
.chat-input .ci-attach svg{width:18px;height:18px}
.chat-input .ci-attach:hover{background:var(--paper-2);color:var(--ink)}
.chat-input input{flex:1;height:44px;border:1.5px solid var(--line-2);border-radius:22px;padding:0 18px;font-size:14px;outline:none}
.chat-input input:focus{border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.chat-send{width:44px;height:44px;border-radius:50%;background:var(--blue-500);color:#fff;display:grid;place-items:center}
.chat-send svg{width:18px;height:18px}
.chat-send:hover{background:var(--blue-600)}

/* settings */
.set-row{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);gap:24px}
.set-row:last-child{border-bottom:none}
.set-row .sr-t{font-size:14.5px;font-weight:600}
.set-row .sr-d{font-size:13px;color:var(--ink-3);margin-top:3px;max-width:440px}
.set-control{flex-shrink:0}
.set-control .input{height:42px;width:auto}
.switch{width:46px;height:26px;border-radius:20px;background:var(--silver-300);position:relative;transition:.18s;cursor:pointer}
.switch.on{background:var(--blue-500)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:var(--shadow-sm)}
.switch.on::after{left:23px}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font-size:13px;font-weight:600;color:var(--ink-3);padding:6px 13px;border-radius:6px}
.seg button.on{background:var(--paper);color:var(--blue-600);box-shadow:var(--shadow-sm)}

/* audit */
.audit-row{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line)}
.audit-row:last-child{border-bottom:none}
.audit-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.audit-ico svg{width:16px;height:16px}
.audit-body{flex:1;min-width:0}
.audit-body .at{font-size:14px;font-weight:500}
.audit-body .at b{font-weight:600}
.audit-body .ad{font-size:12px;color:var(--ink-4);margin-top:2px}
.audit-time{font-size:12.5px;color:var(--ink-4);flex-shrink:0;font-variant-numeric:tabular-nums}

/* misc */
.divider{height:1px;background:var(--line);margin:18px 0}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.wrap{flex-wrap:wrap}
.muted{color:var(--ink-3)}.small{font-size:13px}
.section-title{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:30px 0 14px}
.empty{padding:46px 20px;text-align:center;color:var(--ink-4)}
.empty .ei{width:60px;height:60px;border-radius:18px;background:var(--paper-3);display:grid;place-items:center;margin:0 auto 14px;color:var(--silver-500)}
.empty .ei svg{width:26px;height:26px}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.fselect{height:40px;border:1px solid var(--line-2);border-radius:var(--r-md);padding:0 12px;font-size:13.5px;color:var(--ink-2);background:var(--paper);font-weight:500}
.fselect:focus{outline:none;border-color:var(--blue-400)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--blue-50);color:var(--blue-600)}

/* dropdown panels */
.pop{position:absolute;top:54px;right:0;width:340px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:40;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.pop-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pop-head .ph-t{font-size:14px;font-weight:600}
.notif{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:none}
.notif:hover{background:var(--paper-2)}
.notif .n-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.notif .n-ico svg{width:16px;height:16px}
.notif .n-t{font-size:13.5px;line-height:1.45}
.notif .n-t b{font-weight:600}
.notif .n-time{font-size:11.5px;color:var(--ink-4);margin-top:3px}
.notif.unread{background:var(--blue-50)}
.menu-pop{width:240px}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 16px;font-size:14px;color:var(--ink-2);font-weight:500;width:100%;text-align:left}
.menu-item svg{width:17px;height:17px;color:var(--ink-4)}
.menu-item:hover{background:var(--paper-2)}
.menu-item.danger{color:var(--danger)}.menu-item.danger svg{color:var(--danger)}

/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--r-md);font-size:14px;font-weight:500;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-lg);z-index:90;transition:transform .35s cubic-bezier(.2,.8,.3,1);max-width:440px}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .ti{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex-shrink:0}
#toast .ti svg{width:13px;height:13px}

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.scrim{position:fixed;inset:0;z-index:35}

@media(max-width:1180px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}.g-2-1,.g-1-2,.g-2{grid-template-columns:1fr}}
@media(max-width:880px){.searchbar{display:none}.login-left{display:none}.sidebar{transform:translateX(-100%)}.main{margin-left:0}.chat-wrap{grid-template-columns:1fr}}
</style>
</head>

<div id="root"></div>

  bold:'<path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/>',

/* ---- tetrahedron brand mark ---- */
function logo(size){
  size = size || 34;
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DA6C9"/><stop offset="1" stop-color="#3D7AA8"/></linearGradient>

      <linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8BB5"/><stop offset="1" stop-color="#2E5878"/></linearGradient>

function renderNav(){

  }).join('');
}

function go(view){state.view=view;state.popOpen=null;closePops();document.getElementById('crumb-cur').textContent=TITLES[view];renderNav();renderView();window.scrollTo(0,0);}
function logoutApp(){renderLogin();}

/* ---- popovers ---- */
function togglePop(which,e){e.stopPropagation();if(state.popOpen===which){closePops();return;}closePops();state.popOpen=which;
  const host=document.getElementById('pop-'+which);
  if(which==='notif'){
    const list=NOTIFS[state.role]||[];
    host.innerHTML=`<div class="pop"><div class="pop-head"><span class="ph-t">Notifications</span><a class="link" onclick="closePops()">Mark all read</a></div>
      ${list.map(n=>`<div class="notif ${n.unread?'unread':''}"><span class="n-ico ic-${n.c}">${I(n.ico)}</span><div><div class="n-t">${n.t}</div><div class="n-time">${n.time}</div></div></div>`).join('')}
      <div style="padding:12px 18px;text-align:center"><a class="link">View all activity</a></div></div>`;
  } else {
    host.innerHTML=`<div class="pop menu-pop">
      <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center">${avatar(ROLES[state.role].init,ROLES[state.role].av)}<div><div style="font-size:14px;font-weight:600">${ROLES[state.role].name}</div><div style="font-size:12px;color:var(--ink-4)">${ROLES[state.role].title}</div></div></div>
      <div style="padding:8px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4)">Switch role (demo)</div>
      ${Object.keys(ROLES).map(k=>`<button class="menu-item" onclick="enterApp('${k}')">${I(ROLES[k].ico)}<span>${ROLES[k].title}</span>${k===state.role?I('check','style="margin-left:auto;color:var(--blue-500)"'):''}</button>`).join('')}
      <div style="height:1px;background:var(--line);margin:6px 0"></div>
      <button class="menu-item danger" onclick="logoutApp()">${I('logout')}<span>Sign out</span></button></div>`;
  }
  document.addEventListener('click',closePopsOnce);
}
function closePops(){['notif','menu'].forEach(w=>{const h=document.getElementById('pop-'+w);if(h)h.innerHTML='';});state.popOpen=null;document.removeEventListener('click',closePopsOnce);}
function closePopsOnce(){closePops();}

function wireForm(){[1,2,3].forEach(n=>charCount(n,n===1?20:n===2?10:1));
  // simulate auto-save tick
  if(window._saveTimer)clearInterval(window._saveTimer);
  window._saveTimer=setInterval(()=>{const el=document.getElementById('save-note');if(el)el.textContent='Draft auto-saved · just now';},60000);
}
function charCount(n,min){
  const ta=document.getElementById('ta'+n);const cc=document.getElementById('cc'+n);if(!ta||!cc)return;
  const len=ta.value.trim().length;
  cc.innerHTML=`<span style="color:${len>=min?'var(--ink-4)':'var(--danger)'}">${len} chars${min>1?` · min ${min}`:''}</span>`;
  if(len>=min){ta.classList.remove('err');document.getElementById('er'+n)?.classList.remove('show');}
}
function submitReport(){
  let ok=true;
  [[1,20],[2,10],[3,1]].forEach(([n,min])=>{
    const ta=document.getElementById('ta'+n);const len=ta.value.trim().length;
    if(len<min){ok=false;ta.classList.add('err');document.getElementById('er'+n).classList.add('show');}
  });
  if(!ok){toast('Please complete the required fields',true);return;}
  toast('Report submitted · routed to David Okoye + 2 super admins');
  setTimeout(()=>go('myreports'),900);
}

  const days=[['Mon',98],['Tue',91],['Wed',96],['Thu',88],['Fri',74]];
  return days.map(([d,p])=>{const cls=p>=90?'ok':p>=80?'warn':'danger';
    return `<div class="team-bar" style="grid-template-columns:60px 1fr 48px"><div class="tn">${d}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${p}%"></div></div><div class="pct" style="color:var(--${cls})">${p}%</div></div>`;}).join('');
}

/* ---------- MESSAGES ---------- */
function messagesView(){
  const convs=CONVS[state.role]||[];
  if(!convs.length){
    return pageHead('Messaging','Messages')+`<div class="card"><div class="empty"><div class="ei">${I('chat')}</div><div style="font-weight:600;color:var(--ink-2);font-size:15px;margin-bottom:5px">Messaging isn\u2019t part of the Admin role</div>Admins manage users and settings — they don\u2019t have access to the messaging layer.</div></div>`;
  }
  if(!state.activeConv||!convs.find(c=>c.id===state.activeConv))state.activeConv=convs[0].id;
  return pageHead('Real-time communication','Messages','Team channels, direct messages, and the Trinos assistant — all in one place.')
  +`<div class="chat-wrap">
    <div class="chat-list">
      <div class="chat-search"><div class="searchbar">${I('search')}<input placeholder="Search messages"></div></div>
      <div class="chat-tabs"><button class="chat-tab active">All</button><button class="chat-tab">Channels</button><button class="chat-tab">Direct</button></div>
      <div class="chat-conv" id="chat-conv">${convs.map(c=>convItem(c)).join('')}</div>
    </div>
    <div class="chat-panel" id="chat-panel">${chatPanel(convs.find(c=>c.id===state.activeConv))}</div>
  </div>`;
}
function convItem(c){
  const active=c.id===state.activeConv?'active':'';
  const av=c.type==='bot'?avatar(logoMini(),'blue'):avatar(c.init,c.av);
  return `<div class="conv-item ${active}" onclick="openConv('${c.id}')">${c.type==='bot'?`<div class="avatar blue" style="width:40px;height:40px">${logo(22)}</div>`:avatar(c.init,c.av,40)}
    <div class="ci-body"><div class="ci-top"><span class="ci-nm">${c.nm}</span><span class="ci-time">${c.time}</span></div><div class="ci-last">${c.last}</div></div>
    ${c.unread?`<span class="ci-unread">${c.unread}</span>`:''}</div>`;
}
function logoMini(){return '';}
function chatPanel(c){
  if(!c)return '';
  return `<div class="chat-top">${c.type==='bot'?`<div class="avatar blue" style="width:40px;height:40px">${logo(22)}</div>`:avatar(c.init,c.av,40)}
    <div><div class="ct-nm">${c.nm}</div><div class="ct-sub">${c.type==='bot'?'Trinos Assistant':c.sub}</div></div>
    <div class="ct-acts"><button class="tb-btn">${I('search')}</button><button class="tb-btn">${I('users')}</button></div></div>
    <div class="chat-body" id="chat-body">${c.msgs.map(m=>msgHTML(m,c)).join('')}</div>
    <div class="chat-input"><button class="ci-attach" onclick="attachRef()">${I('clip')}</button><input id="chat-text" placeholder="Message ${c.nm}…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="chat-send" onclick="sendMsg()">${I('send')}</button></div>`;
}
function msgHTML(m,c){
  if(m.day)return `<div class="chat-day">${m.day}</div>`;
  if(m.bot)return botCard();
  const ref=m.ref?`<div class="msg-ref">${I('file')}<span>${m.ref}</span></div>`:'';
  const body=m.t?`<div class="bubble">${m.t}</div>`:'';
  const meta=m.side==='out'?`<div class="meta">${m.time||''} ${m.read?I('checks'):I('check')}</div>`:(m.nm?`<div class="meta">${m.nm} · ${m.time||''}</div>`:`<div class="meta">${m.time||''}</div>`);
  return `<div class="msg ${m.side}">${ref}${body}${(m.t||m.side==='out')?meta:''}</div>`;
}
function botCard(){
  return `<div class="bot-card"><div class="bc-head">${logo(18)}Trinos Assistant</div>
    <div style="font-size:14px;color:var(--ink-2);line-height:1.5">Hi! I can help you move faster. What would you like to do?</div>
    <div class="bc-quick">
      <button class="quick" onclick="botQuick('submit')">Submit today\u2019s report</button>
      <button class="quick" onclick="botQuick('blockers')">Show my blockers</button>
      <button class="quick" onclick="botQuick('history')">My report history</button>
    </div></div>`;
}
function openConv(id){state.activeConv=id;const c=(CONVS[state.role]||[]).find(x=>x.id===id);if(c)c.unread=0;
  document.getElementById('chat-conv').innerHTML=(CONVS[state.role]||[]).map(convItem).join('');
  document.getElementById('chat-panel').innerHTML=chatPanel(c);wireChat();}
function wireChat(){const b=document.getElementById('chat-body');if(b)b.scrollTop=b.scrollHeight;}
function sendMsg(){
  const inp=document.getElementById('chat-text');if(!inp||!inp.value.trim())return;
  const c=(CONVS[state.role]||[]).find(x=>x.id===state.activeConv);
  c.msgs.push({side:'out',t:inp.value.trim(),time:'now',read:false});c.last='You: '+inp.value.trim();inp.value='';
  document.getElementById('chat-body').innerHTML=c.msgs.map(m=>msgHTML(m,c)).join('');wireChat();
  if(c.type==='bot'){setTimeout(()=>{c.msgs.push({side:'in',t:'On it — opening that for you now.',time:'now'});document.getElementById('chat-body').innerHTML=c.msgs.map(m=>msgHTML(m,c)).join('');wireChat();},700);}
}
function attachRef(){const c=(CONVS[state.role]||[]).find(x=>x.id===state.activeConv);c.msgs.push({side:'out',ref:'SR-2641 · Daily report · Jun 9',t:''});document.getElementById('chat-body').innerHTML=c.msgs.map(m=>msgHTML(m,c)).join('');wireChat();toast('Report attached');}
function botQuick(kind){if(kind==='submit')go('submit');else if(kind==='blockers'){if(state.role==='employee')go('myreports');else go('blockers');}else go('myreports');}

/* ---------- USERS (admin) ---------- */
function usersView(){
  return pageHead('User management','Users','Create, edit, and deactivate accounts. Self-registration is disabled by policy.',
    `<button class="btn btn-ghost btn-sm">${I('download')}Export</button><button class="btn btn-primary btn-sm" onclick="toast('Open: create new user')">${I('plus')}Add user</button>`)
  +filterBar(['All roles','Employee','Team Lead','Super Admin'],['All teams','Platform','Product','Design','Data'])
  +`<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>User</th><th>Role</th><th>Team</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>
    ${USERS.map(u=>`<tr><td><div class="u-cell">${avatar(u.init,u.av)}<div><div class="nm">${u.nm}</div><div class="em">${u.em}</div></div></div></td>
      <td><span class="tag ${u.role==='Super Admin'?'tag-purple':u.role==='Team Lead'?'tag-blue':'tag-gray'}">${u.role}</span></td>
      <td class="small">${u.team}</td>
      <td>${u.status==='Active'?`<span class="tag tag-ok">${I('check')}Active</span>`:`<span class="tag tag-gray">Inactive</span>`}</td>
      <td><div class="tbl-acts"><button class="tbl-act" title="Edit" onclick="toast('Edit '+'${u.nm}')">${I('pencil')}</button><button class="tbl-act" title="Message"  onclick="toast('Deactivate '+'${u.nm}')">${I('trash')}</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ---------- TEAMS (admin) ---------- */
function teamsView(){
  return pageHead('Team management','Teams','Teams mirror your org structure. Each team has a lead and reports route accordingly.',
    `<button class="btn btn-primary btn-sm" onclick="toast('Open: create new team')">${I('plus')}New team</button>`)
  +`<div class="grid g-3">${ORG_TEAMS.map(t=>`
    <div class="card card-pad">
      <div class="flex between center" style="margin-bottom:14px"><div class="ico-box ic-blue" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center">${I('layers')}</div><button class="tbl-act">${I('gear')}</button></div>
      <div style="font-family:'Sora';font-size:18px;font-weight:600">${t.nm}</div>
      <div class="small muted" style="margin-top:3px">Lead · ${t.lead}</div>
      <div class="divider"></div>
      <div class="flex between center"><div><div style="font-family:'Sora';font-size:20px;font-weight:700">${t.members}</div><div class="small muted">members</div></div>
      <div style="text-align:right"><div style="font-family:'Sora';font-size:20px;font-weight:700;color:var(--${t.pct>=90?'ok':t.pct>=80?'warn':'danger'})">${t.pct}%</div><div class="small muted">compliance</div></div></div>
    </div>`).join('')}</div>`;
}

/* ---------- SETTINGS (admin) ---------- */
function settingsView(){
  return pageHead('Platform configuration','Settings','Org-wide rules for submissions, sessions, and notifications. Changes take effect immediately.','')
  +`<div class="grid g-1-2" style="align-items:start">
    <div class="card card-pad">
      <div style="font-family:'Sora';font-weight:600;font-size:16px;margin-bottom:6px">Sections</div>
      <div class="small muted" style="margin-bottom:14px">Jump to a settings group</div>
      ${['Submissions','Sessions & security','Notifications','Data & retention'].map((s,i)=>`<button class="nav-item" style="color:${i===0?'var(--blue-600)':'var(--ink-2)'};background:${i===0?'var(--blue-50)':'transparent'};margin-bottom:4px">${I(['edit','shield','bell','layers'][i])}<span>${s}</span></button>`).join('')}
    </div>
    <div>
      <div class="card" style="margin-bottom:18px"><div class="card-head"><h3>Submissions</h3></div><div class="card-pad">
        ${setRow('Daily submission deadline','Reports submitted after this time are marked late.',`<input class="input" value="6:00 PM" style="width:120px">`)}
        ${setRow('Edit window after submission','How long employees can edit a submitted report.',`<select class="fselect"><option>1 hour</option><option>30 minutes</option><option>2 hours</option></select>`)}
        ${setRow('Require explicit "None" for blockers','Force users to type "None" if they have no blockers.',`<div class="switch on" onclick="this.classList.toggle('on')"></div>`)}
        ${setRow('Auto-save drafts','Save drafts automatically every 60 seconds.',`<div class="switch on" onclick="this.classList.toggle('on')"></div>`)}
      </div></div>
      <div class="card" style="margin-bottom:18px"><div class="card-head"><h3>Sessions & security</h3></div><div class="card-pad">
        ${setRow('Session timeout','Sign users out after this period of inactivity.',`<select class="fselect"><option>8 hours</option><option>4 hours</option><option>12 hours</option></select>`)}
        ${setRow('Lock account after failed logins','Number of consecutive failures before lockout.',`<input class="input" value="5" style="width:80px">`)}
        ${setRow('Prevent concurrent sessions','Only one active session per account.',`<div class="switch on" onclick="this.classList.toggle('on')"></div>`)}
      </div></div>
      <div class="card"><div class="card-head"><h3>Data & retention</h3></div><div class="card-pad">
        ${setRow('Report retention','Minimum time reports are kept before archival.',`<select class="fselect"><option>12 months</option><option>24 months</option><option>36 months</option></select>`)}
        ${setRow('Timezone','Used for deadlines and timestamps.',`<select class="fselect"><option>Asia/Kolkata (IST)</option><option>UTC</option><option>America/New_York</option></select>`)}
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button class="btn btn-ghost btn-sm">Discard</button><button class="btn btn-primary btn-sm" onclick="toast('Settings saved')">${I('check')}Save changes</button></div>
      </div></div>
    </div></div>`;
}
function setRow(t,d,control){return `<div class="set-row"><div><div class="sr-t">${t}</div><div class="sr-d">${d}</div></div><div class="set-control">${control}</div></div>`;}

/* ---------- AUDIT (admin) ---------- */
function auditView(){
  return pageHead('Security & compliance','Audit log','An immutable record of authentication, role changes, deletions, and report routing.',
    `<select class="fselect"><option>All events</option><option>Authentication</option><option>Role changes</option><option>Security</option></select><button class="btn btn-ghost btn-sm">${I('download')}Export</button>`)
  +`<div class="card"><div class="card-head"><h3>Today · June 9</h3><span class="tag tag-gray">${AUDIT.length} events</span></div>${AUDIT.map(a=>auditRow(a)).join('')}</div>`;
}

/* ---------- shared filter bar ---------- */
function filterBar(){
  const groups=[...arguments];
  return `<div class="filter-bar">${I('filter','width="16" height="16" style="color:var(--ink-4)"')}
    ${groups.map(g=>`<select class="fselect">${g.map(o=>`<option>${o}</option>`).join('')}</select>`).join('')}
    <span class="chip">${I('calendar')}Jun 9, 2025</span></div>`;
}

/* ---------- toast ---------- */
function toast(msg,danger){
  const t=document.getElementById('toast');
  t.querySelector('.ti').innerHTML=danger?I('alert'):I('check');
  t.querySelector('.ti').style.background=danger?'var(--danger)':'var(--ok)';
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ---------- boot ---------- */
renderLogin();
</script>
