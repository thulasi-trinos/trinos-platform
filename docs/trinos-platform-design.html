<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinos — Status Report Platform · Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#1B3A52; --blue-800:#234C6B; --blue-700:#2E5878; --blue-600:#356A92;
  --blue-500:#3D7AA8; --blue-400:#5B8BB5; --blue-300:#8DB1CE; --blue-200:#C0D5E6;
  --blue-100:#DCE8F1; --blue-50:#EEF4F9;
  --silver-700:#6B727B; --silver-600:#8A9099; --silver-500:#9CA2AB; --silver-400:#AEB4BC;
  --silver-300:#C5CAD1; --silver-200:#D9DDE2; --silver-100:#E8EBEE; --silver-50:#F4F6F8;
  --ink:#172430; --ink-2:#3A4756; --ink-3:#6A7686; --ink-4:#97A1AD;
  --paper:#FFFFFF; --paper-2:#F5F7FA; --paper-3:#EEF1F5;
  --line:#E4E9EE; --line-2:#D6DDE4;
  --ok:#2E8B6F; --ok-bg:#E4F2EC; --warn:#C8852A; --warn-bg:#FBF0DF; --danger:#C0473F; --danger-bg:#FBE9E7;
  --shadow-sm:0 1px 2px rgba(23,36,48,.06),0 1px 3px rgba(23,36,48,.04);
  --shadow-md:0 4px 14px rgba(23,36,48,.08),0 2px 6px rgba(23,36,48,.05);
  --shadow-lg:0 18px 50px rgba(23,36,48,.16);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --grad-tri:linear-gradient(135deg,#5B8BB5 0%,#3D7AA8 55%,#2E5878 100%);
  --grad-soft:linear-gradient(160deg,#EEF4F9 0%,#F5F7FA 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  color:var(--ink); background:var(--paper-2);
  -webkit-font-smoothing:antialiased; line-height:1.55; overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::selection{background:var(--blue-200);color:var(--blue-900)}
.hidden{display:none!important}

/* ---------- LOGO ---------- */
.tri{display:block}
.tri-wrap{display:flex;align-items:center;gap:11px}
.tri-word{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:.16em;font-size:18px;color:var(--ink)}
.tri-word .o{color:var(--blue-500)}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;background:var(--paper);z-index:50}
.login-left{flex:1.1;background:var(--grad-tri);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:54px 56px;color:#fff}
.login-left::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:46px 46px;opacity:.5}
.login-tri-bg{position:absolute;right:-120px;bottom:-140px;width:560px;opacity:.16;transform:rotate(8deg)}
.login-tri-bg2{position:absolute;left:-90px;top:60px;width:230px;opacity:.10;transform:rotate(-20deg)}
.login-brand{display:flex;align-items:center;gap:13px;position:relative;z-index:2}
.login-brand .tri-word{color:#fff}
.login-brand .tri-word .o{color:#CFE0EE}
.login-hero{position:relative;z-index:2;max-width:440px}
.login-hero h1{font-size:44px;line-height:1.08;font-weight:700;margin-bottom:20px}
.login-hero p{font-size:17px;color:#DCEAF4;line-height:1.6;font-weight:400}
.login-points{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.login-point{display:flex;align-items:center;gap:13px;font-size:15px;color:#EAF2F8}
.lp-dot{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex-shrink:0}
.login-foot{position:relative;z-index:2;font-size:13px;color:#BFD5E6}
.login-right{flex:.9;display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:380px}
.login-card .eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-500);margin-bottom:10px}
.login-card h2{font-size:28px;font-weight:600;margin-bottom:8px}
.login-card .sub{color:var(--ink-3);font-size:15px;margin-bottom:30px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input{width:100%;height:46px;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:0 14px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--paper);transition:.15s}
.input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.input::placeholder{color:var(--ink-4)}
.field-row{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--blue-500);font-size:13px;font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:var(--r-md);font-size:15px;font-weight:600;font-family:inherit;transition:.16s;white-space:nowrap}
.btn-primary{background:var(--blue-500);color:#fff;box-shadow:0 4px 12px rgba(61,122,168,.28)}
.btn-primary:hover{background:var(--blue-600);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-block{width:100%;margin-top:8px}
.btn-ghost{background:var(--paper);color:var(--ink-2);border:1.5px solid var(--line-2)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--silver-400)}
.btn-sm{height:38px;padding:0 15px;font-size:14px;border-radius:var(--r-sm)}
.btn-tiny{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.login-note{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);text-align:center}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
#app.on{display:flex}
.sidebar{width:248px;background:var(--blue-900);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30}
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .tri-word{color:#fff;font-size:16px}
.sb-brand .tri-word .o{color:var(--blue-300)}
.sb-role{margin:16px 14px 8px;padding:12px;background:rgba(255,255,255,.06);border-radius:var(--r-md)}
.sb-role .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-300);font-weight:600;margin-bottom:8px}
.role-select{width:100%;height:38px;background:var(--blue-800);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-family:inherit;font-size:14px;font-weight:500;padding:0 10px;cursor:pointer}
.role-select:focus{outline:none;border-color:var(--blue-400)}
.role-select option{color:var(--ink)}
.sb-nav{flex:1;padding:10px 14px;overflow-y:auto}
.nav-section{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-300);font-weight:600;padding:14px 12px 7px;opacity:.8}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);color:#C7D7E4;font-size:14.5px;font-weight:500;margin-bottom:2px;cursor:pointer;transition:.13s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue-500);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.nav-item .ico{width:19px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.nav-item.active .badge{background:rgba(255,255,255,.28)}
.sb-user{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:11px;background:var(--grad-tri);display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;font-family:'Sora'}
.avatar.sm{width:32px;height:32px;border-radius:9px;font-size:12px}
.avatar.lg{width:52px;height:52px;border-radius:14px;font-size:18px}
.sb-user .meta{min-width:0}
.sb-user .nm{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .rl{font-size:12px;color:var(--blue-300)}

/* main */
.main{margin-left:248px;flex:1;min-width:0}
.topbar{height:66px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;font-weight:600}
.topbar .crumb{font-size:13px;color:var(--ink-4);font-weight:500}
.searchbar{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);height:40px;padding:0 14px;width:280px;color:var(--ink-4)}
.searchbar input{border:none;background:none;outline:none;font-family:inherit;font-size:14px;color:var(--ink);width:100%}
.topbar-icon{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3);position:relative;border:1px solid var(--line);background:var(--paper)}
.topbar-icon:hover{background:var(--paper-2);color:var(--ink)}
.topbar-icon .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--paper)}
.content{padding:30px;max-width:1240px}

/* page header */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:18px;flex-wrap:wrap}
.page-head .pe{font-size:13px;font-weight:600;color:var(--blue-500);letter-spacing:.04em;margin-bottom:6px}
.page-head h2{font-size:26px;font-weight:600;line-height:1.2}
.page-head p{color:var(--ink-3);font-size:15px;margin-top:5px;max-width:540px}
.head-actions{display:flex;gap:10px;align-items:center}

/* cards & grid */
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}
.g-1-2{grid-template-columns:1fr 1.7fr}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:16px;font-weight:600}
.card-head .sub{font-size:13px;color:var(--ink-4);margin-top:2px}

/* metric / stat */
.stat{padding:20px 22px;position:relative;overflow:hidden}
.stat .corner{position:absolute;top:-22px;right:-22px;width:74px;height:74px;opacity:.10}
.stat .ico-box{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;font-size:19px;margin-bottom:14px}
.stat .val{font-family:'Sora';font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.stat .lbl{font-size:13.5px;color:var(--ink-3);font-weight:500;margin-top:7px}
.stat .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;margin-top:10px;padding:3px 8px;border-radius:20px}
.delta.up{color:var(--ok);background:var(--ok-bg)}
.delta.down{color:var(--danger);background:var(--danger-bg)}
.delta.flat{color:var(--ink-3);background:var(--paper-3)}
.ic-blue{background:var(--blue-50);color:var(--blue-600)}
.ic-silver{background:var(--silver-100);color:var(--silver-700)}
.ic-ok{background:var(--ok-bg);color:var(--ok)}
.ic-warn{background:var(--warn-bg);color:var(--warn)}

/* report list */
.rep-row{display:flex;align-items:flex-start;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);transition:.12s}
.rep-row:last-child{border-bottom:none}
.rep-row:hover{background:var(--paper-2)}
.rep-date{width:54px;text-align:center;flex-shrink:0}
.rep-date .d{font-family:'Sora';font-size:20px;font-weight:700;line-height:1}
.rep-date .m{font-size:11px;text-transform:uppercase;color:var(--ink-4);font-weight:600;letter-spacing:.04em;margin-top:2px}
.rep-body{flex:1;min-width:0}
.rep-body .t{font-size:14.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.rep-body .x{font-size:13.5px;color:var(--ink-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.tag-ok{background:var(--ok-bg);color:var(--ok)}
.tag-warn{background:var(--warn-bg);color:var(--warn)}
.tag-danger{background:var(--danger-bg);color:var(--danger)}
.tag-blue{background:var(--blue-50);color:var(--blue-600)}
.tag-gray{background:var(--paper-3);color:var(--ink-3)}

/* submission form */
.form-card{max-width:760px}
.form-field{padding:20px 24px;border-bottom:1px solid var(--line)}
.form-field:last-child{border-bottom:none}
.ff-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ff-num{width:24px;height:24px;border-radius:7px;background:var(--blue-50);color:var(--blue-600);font-size:12px;font-weight:700;display:grid;place-items:center;font-family:'Sora'}
.ff-head .ttl{font-size:15px;font-weight:600}
.ff-head .req{font-size:11px;font-weight:700;color:var(--danger);background:var(--danger-bg);padding:1px 7px;border-radius:5px}
.ff-head .opt{font-size:11px;font-weight:600;color:var(--ink-4);background:var(--paper-3);padding:1px 7px;border-radius:5px}
.ff-hint{font-size:13px;color:var(--ink-4);margin:0 0 12px 34px}
.toolbar{display:flex;gap:2px;margin:0 0 8px 34px;padding:5px;background:var(--paper-2);border:1px solid var(--line);border-radius:9px;width:fit-content}
.tb-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);font-size:14px}
.tb-btn:hover{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
.textarea{width:calc(100% - 34px);margin-left:34px;min-height:88px;border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:12px 14px;font-family:inherit;font-size:14.5px;color:var(--ink);resize:vertical;line-height:1.6}
.textarea:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.ff-foot{margin-left:34px;margin-top:7px;font-size:12px;color:var(--ink-4);display:flex;justify-content:space-between}
.form-foot{padding:18px 24px;display:flex;align-items:center;gap:12px;background:var(--paper-2);border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
.form-foot .save-note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);margin-right:auto}

/* progress ring & bars */
.bar-track{height:8px;background:var(--paper-3);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:var(--grad-tri)}
.bar-fill.ok{background:var(--ok)} .bar-fill.warn{background:var(--warn)} .bar-fill.danger{background:var(--danger)}

/* team grid */
.member-row{display:grid;grid-template-columns:1.6fr repeat(5,1fr);align-items:center;padding:13px 22px;border-bottom:1px solid var(--line);gap:8px}
.member-row.head{background:var(--paper-2);font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
.member-row:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.member-cell{display:flex;align-items:center;gap:11px;min-width:0}
.member-cell .nm{font-size:14px;font-weight:600}
.member-cell .em{font-size:12.5px;color:var(--ink-4)}
.daycell{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:600;margin:0 auto}
.dc-ok{background:var(--ok-bg);color:var(--ok)}
.dc-miss{background:var(--paper-3);color:var(--ink-4)}
.dc-late{background:var(--warn-bg);color:var(--warn)}

/* blocker */
.blocker{display:flex;gap:13px;padding:15px 18px;border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:var(--r-md);background:var(--paper);margin-bottom:12px}
.blocker.med{border-left-color:var(--warn)}
.blocker .bk-ico{width:34px;height:34px;border-radius:9px;background:var(--danger-bg);color:var(--danger);display:grid;place-items:center;flex-shrink:0;font-size:16px}
.blocker.med .bk-ico{background:var(--warn-bg);color:var(--warn)}
.blocker .bk-body{flex:1;min-width:0}
.blocker .bk-t{font-size:14px;font-weight:600;margin-bottom:3px}
.blocker .bk-x{font-size:13px;color:var(--ink-3);line-height:1.5}
.blocker .bk-meta{font-size:12px;color:var(--ink-4);margin-top:7px;display:flex;align-items:center;gap:8px}

/* compliance bars list */
.team-bar{display:grid;grid-template-columns:140px 1fr 56px;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.team-bar:last-child{border-bottom:none}
.team-bar .tn{font-size:14px;font-weight:600}
.team-bar .tn small{display:block;font-size:12px;color:var(--ink-4);font-weight:400}
.team-bar .pct{font-family:'Sora';font-weight:700;font-size:15px;text-align:right}

/* admin table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;padding:13px 22px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--paper-2)}
.cell-user{display:flex;align-items:center;gap:11px}
.cell-user .nm{font-weight:600}
.cell-user .em{font-size:12.5px;color:var(--ink-4)}
.role-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:20px}
.rp-emp{background:var(--silver-100);color:var(--silver-700)}
.rp-tl{background:var(--blue-50);color:var(--blue-600)}
.rp-sa{background:#EFE7F5;color:#7B4A9E}
.rp-adm{background:var(--warn-bg);color:var(--warn)}
.tbl-act{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink-4)}
.tbl-act:hover{background:var(--paper-3);color:var(--ink)}

/* chat */
.chat-wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 66px - 60px);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--paper)}
.chat-list{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--paper-2)}
.chat-search{padding:14px;border-bottom:1px solid var(--line)}
.chat-search .searchbar{width:100%;margin:0;background:var(--paper)}
.chat-conv{flex:1;overflow-y:auto}
.conv-item{display:flex;gap:11px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
.conv-item:hover{background:var(--paper)}
.conv-item.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--blue-500)}
.conv-item .ci-body{flex:1;min-width:0}
.conv-item .ci-top{display:flex;justify-content:space-between;gap:8px}
.conv-item .ci-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .ci-time{font-size:11.5px;color:var(--ink-4);flex-shrink:0}
.conv-item .ci-last{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-item .ci-unread{position:absolute;right:14px;bottom:14px;background:var(--blue-500);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.chat-panel{display:flex;flex-direction:column}
.chat-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.chat-top .ct-nm{font-size:15px;font-weight:600}
.chat-top .ct-sub{font-size:12.5px;color:var(--ok);display:flex;align-items:center;gap:6px}
.chat-top .ct-sub::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat-body{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;background:var(--paper-2)}
.chat-day{text-align:center;font-size:12px;color:var(--ink-4);font-weight:500;margin:4px 0}
.msg{max-width:64%;display:flex;flex-direction:column;gap:4px}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg .bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.in .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.out .bubble{background:var(--blue-500);color:#fff;border-bottom-right-radius:5px}
.msg .meta{font-size:11px;color:var(--ink-4);padding:0 4px}
.msg-ref{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--blue-700);display:flex;align-items:center;gap:9px}
.bot-card{align-self:flex-start;max-width:72%;background:var(--paper);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:5px;padding:13px 15px}
.bot-card .bc-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--blue-600);margin-bottom:8px}
.bot-card .bc-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick{font-size:12.5px;font-weight:600;color:var(--blue-600);background:var(--blue-50);border:1px solid var(--blue-100);padding:6px 12px;border-radius:20px}
.quick:hover{background:var(--blue-100)}
.chat-input{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.chat-input input{flex:1;height:44px;border:1.5px solid var(--line-2);border-radius:22px;padding:0 18px;font-family:inherit;font-size:14px;outline:none}
.chat-input input:focus{border-color:var(--blue-400);box-shadow:0 0 0 4px var(--blue-50)}
.chat-send{width:44px;height:44px;border-radius:50%;background:var(--blue-500);color:#fff;display:grid;place-items:center;font-size:17px}
.chat-send:hover{background:var(--blue-600)}

/* misc */
.divider{height:1px;background:var(--line);margin:18px 0}
.flex{display:flex} .between{justify-content:space-between} .center{align-items:center} .gap{gap:12px}
.muted{color:var(--ink-3)} .small{font-size:13px}
.section-title{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:30px 0 14px}
.empty{padding:46px 20px;text-align:center;color:var(--ink-4)}
.empty .ei{width:62px;height:62px;border-radius:18px;background:var(--paper-3);display:grid;place-items:center;margin:0 auto 14px;font-size:26px;color:var(--silver-500)}

/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--r-md);font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);z-index:80;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .ti{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:13px}

/* fade-in */
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view{display:none}
.view.active{display:block}

@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}.g-2-1,.g-1-2,.g-2{grid-template-columns:1fr}}
@media(max-width:760px){.login-left{display:none}.sidebar{transform:translateX(-100%)}.main{margin-left:0}}

<body>

<div id="root"></div>

<script>
/* ============ TRINOS — interactive design prototype ============ */

/* ---- Tetrahedron logo (matches brand mark) ---- */
function logo(size){
  size = size || 34;
  const id = 'g'+Math.random().toString(36).slice(2,7);
  return `<svg class="tri" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7DA6C9"/><stop offset="1" stop-color="#3D7AA8"/>
      </linearGradient>
      <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C9CED5"/><stop offset="1" stop-color="#9AA1AB"/>
      </linearGradient>
      <linearGradient id="${id}c" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5B8BB5"/><stop offset="1" stop-color="#2E5878"/>
      </linearGradient>
    </defs>
    <polygon points="50,8 8,88 50,58" fill="url(#${id}a)"/>
    <polygon points="50,8 92,88 50,58" fill="url(#${id}b)"/>
    <polygon points="8,88 92,88 50,58" fill="url(#${id}c)"/>
    <path d="M50,8 L50,58 M8,88 L50,58 M92,88 L50,58" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="50,8 8,88 92,88" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" opacity=".55"/>
  </svg>`;
}
function ic(n){return `<i style="font-style:normal">${n}</i>`;}
function avatar(initials,cls){return `<div class="avatar ${cls||''}">${initials}</div>`;}

/* ---- State ---- */

const NAV = {

}

/* ============ VIEWS ============ */

function stat(icoCls,ico,val,lbl,delta,deltaTxt,corner){

    <div class="delta ${delta}">${arrow} ${deltaTxt}</div>

}

/* ============ INTERACTIONS ============ */
function mount(){document.getElementById('root').innerHTML = renderLogin();}
function enterApp(){
  document.getElementById('login').style.display='none';
  state.view = DEFAULT_VIEW[state.role];
  document.getElementById('root').innerHTML = renderApp();
  renderView();
}
function switchRole(r){
  state.role=r; state.view=DEFAULT_VIEW[r];
  document.getElementById('root').innerHTML = renderApp();
  renderView();
}
function go(v){
  state.view=v;
  // refresh nav active states
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('root').innerHTML = renderApp();
  renderView();
}
function renderView(){
  const host=document.getElementById('view-host');
  const title=document.getElementById('page-title');
  if(title) title.textContent = TITLES[state.view]||'Dashboard';
  if(host) host.innerHTML = viewHTML(state.view);
}
function charCount(el,id,min){
  const n=el.value.length;
  const t=document.getElementById(id);
  if(t) t.textContent = n+' characters'+(n<min?` · ${min-n} more needed`:'');
  if(t) t.style.color = n<min?'var(--danger)':'var(--ink-4)';
}
function submitReport(){
  toast('Report submitted · routed to D. Okoye + 2 MDs','✓');
  setTimeout(()=>{state.view='dashboard';go('dashboard');},900);
}
function sendMsg(){
  const i=document.getElementById('chat-text'); if(!i||!i.value.trim())return;
  const body=document.getElementById('chat-body');
  const m=document.createElement('div'); m.className='msg out';
  m.innerHTML=`<div class="bubble">${i.value.replace(/</g,'&lt;')}</div><div class="meta">Now · Sent</div>`;
  body.appendChild(m); i.value=''; body.scrollTop=body.scrollHeight;
}
let toastT;
function toast(msg,ic){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.querySelector('.ti').textContent=ic||'✓';
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
mount();
